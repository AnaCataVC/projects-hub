name: Weekly Portfolio Drift Audit

on:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portfolio synchronization and SEO audits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: AnaCataVC
        run: |
          node .agents/skills/hub-portfolio-sync-audit/scripts/audit-projects.mjs --json > audit-report.json
          node .agents/skills/hub-portfolio-sync-audit/scripts/audit-projects.mjs
          node .agents/skills/hub-audit-product-landing/scripts/audit-product-landings.mjs --json > landings-report.json || true
          node .agents/skills/hub-audit-product-landing/scripts/audit-product-landings.mjs || true

      - name: Publish Drift Summary & Manage GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .agents/skills/hub-portfolio-sync-audit/scripts/publish-drift-report.mjs
