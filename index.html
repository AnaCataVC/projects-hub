<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana-Catalina | Projects Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --primary: #818cf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            
            --pastel-lilac: #c7b8ea;
            --pastel-pink: #f7c6d9;
            --pastel-blue: #bcdffb;
            --pastel-mint: #c8f3e0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Lang Toggle Button */
        .lang-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .lang-toggle:hover {
            transform: scale(1.05);
            border-color: var(--primary);
            color: var(--primary);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            top: 20%;
            left: 20%;
            width: 300px;
            height: 300px;
            background-color: var(--pastel-blue);
        }
        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 320px;
            height: 320px;
            background-color: var(--pastel-pink);
        }
        .blob-3 {
            top: 30%;
            right: 30%;
            width: 250px;
            height: 250px;
            background-color: var(--pastel-lilac);
        }

        .container {
            max-width: 900px;
            width: 100%;
            padding: 2rem;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.025em;
            line-height: 1.1;
        }
        
        h1 span.highlight {
            color: var(--primary);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem; 
            padding: 1.5rem 2rem;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
            border-color: rgba(129, 140, 248, 0.5);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(199, 184, 234, 0.1);
            color: #a5b4fc;
            margin-bottom: 1rem;
            width: fit-content;
        }

        .card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.025em;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.5;
            flex-grow: 1;
            margin: 0;
        }

        .card-footer {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .card-footer::after {
            content: '→';
            margin-left: 0.5rem;
            transition: transform 0.3s ease;
        }

        .card:hover .card-footer::after {
            transform: translateX(4px);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <button id="lang-toggle" class="lang-toggle" aria-label="Cambiar idioma">
        <span id="current-lang">EN</span>
    </button>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <header>
            <h1><span class="highlight">Ana-Catalina</span> <br> Projects Hub</h1>
            <p class="subtitle" data-i18n="subtitle">Explora mi portafolio y aplicaciones</p>
        </header>
        
        <div class="grid">
            <a href="/my-cv/" class="card">
                <span class="badge" data-i18n="badge_cv">Plantilla Open Source</span>
                <h2>My CV Template</h2>
                <p data-i18n="desc_cv">Una plantilla moderna e interactiva para crear tu propio currículum o portafolio profesional. Fácil de configurar y desplegar.</p>
                <div class="card-footer" data-i18n="btn_view">Ver proyecto</div>
            </a>
        </div>
    </div>

    <script>
        const translations = {
            'subtitle': { 
                'es': 'Explora mi portafolio y aplicaciones', 
                'en': 'Explore my portfolio and applications' 
            },
            'badge_cv': { 
                'es': 'Plantilla Open Source', 
                'en': 'Open Source Template' 
            },
            'desc_cv': { 
                'es': 'Una plantilla moderna e interactiva para crear tu propio currículum o portafolio profesional. Fácil de configurar y desplegar.', 
                'en': 'A modern and interactive template to build your own resume or professional portfolio. Easy to configure and deploy.' 
            },
            'btn_view': { 
                'es': 'Ver proyecto', 
                'en': 'View project' 
            }
        };

        // Check if there's a stored language or use browser language
        let currentLang = localStorage.getItem('lang');
        if (!currentLang) {
            const browserLang = navigator.language || navigator.userLanguage;
            currentLang = browserLang.toLowerCase().startsWith('en') ? 'en' : 'es';
            localStorage.setItem('lang', currentLang); 
        }

        function updateTexts() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[key] && translations[key][currentLang]) {
                    el.innerHTML = translations[key][currentLang];
                }
            });
            
            const langText = document.getElementById('current-lang');
            if (langText) {
                langText.textContent = currentLang === 'es' ? 'EN' : 'ES';
            }
            
            document.documentElement.lang = currentLang;
        }

        // Toggle language on button click
        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            localStorage.setItem('lang', currentLang);
            updateTexts();
        });

        // Run on load
        updateTexts();
    </script>
</body>
</html>
